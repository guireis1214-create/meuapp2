<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MenuFlow</title><style>
:root{--navy:#15243b;--orange:#f28b32;--bg:#f5f7fb;--green:#169b62;--red:#bd4242;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial;color:#1d2939}header{background:var(--navy);color:white;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header img{width:44px;height:44px;object-fit:contain}header h1{margin:0;flex:1;font-size:22px}main{max-width:1100px;margin:22px auto;padding:0 15px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #10243b0c}.hidden{display:none!important}button{border:0;border-radius:10px;background:var(--orange);color:white;padding:10px 14px;font-weight:650;cursor:pointer;margin:4px}button.alt{background:#e9edf2;color:#203448}button.danger{background:var(--red)}input,textarea,select{width:100%;padding:10px;border:1px solid #d7dce2;border-radius:9px;margin:5px 0 12px;font:inherit}label{font-weight:600;font-size:14px}.muted,small{color:#697787}.error{color:#b52e2e}.success{color:#16814e}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{background:#edf1f4;color:#233448}.tab.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.food,.rest{border:1px solid var(--line);border-radius:14px;padding:14px;background:white}.price{font-weight:800;color:var(--green)}table{width:100%;border-collapse:collapse;overflow:auto}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:12px}.stat b{font-size:24px;display:block}.status{background:#f0f4f7;padding:4px 9px;border-radius:50px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}@media(max-width:600px){main{margin:10px auto}.card{padding:13px}}
</style></head><body><header><img src="/logo.webp" alt="MenuFlow"><h1>MenuFlow</h1><span id="who"></span><button id="logout" class="alt hidden">Sair</button></header><main>
<section id="auth" class="card"><h2>Entrar ou criar conta</h2><p class="muted">Contas individuais e áreas separadas por perfil.</p><div class="tabs"><button class="tab active" id="loginTab">Entrar</button><button class="tab" id="clientTab">Criar conta cliente</button><button class="tab" id="restTab">Cadastrar restaurante</button></div><form id="loginForm"><label>E-mail</label><input name="email" type="email" required autocomplete="username"><label>Senha</label><input name="password" type="password" required autocomplete="current-password"><button>Entrar</button></form><form id="clientForm" class="hidden"><label>Nome</label><input name="name" required><label>E-mail</label><input name="email" type="email" required><label>Telefone</label><input name="phone"><label>Senha (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required><button>Criar conta</button></form><form id="restaurantForm" class="hidden"><label>Nome do restaurante</label><input name="name" required><label>Responsável</label><input name="owner" required><label>E-mail para login</label><input name="email" type="email" required><label>Telefone</label><input name="phone"><label>Endereço</label><input name="address"><label>Senha (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required><button>Solicitar cadastro</button><p class="muted">O restaurante será liberado após aprovação do suporte.</p></form><p id="authMsg"></p></section>
<section id="area" class="hidden card"><div class="tabs" id="areaTabs"></div><div id="areaContent"></div></section></main><script src="/app.js"></script></body></html>
